<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-TF AI Trading Signals</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
  <div>
    <h1>🤖 Multi-TF AI Trading Signals</h1>
    <p style="color:#8b949e; font-size:0.9em;">
      16 coins · 6 timeframes · v3 ATR-blended SL/TP · BE auto-arm · Time-based force close
    </p>
  </div>
  <div>
    <span class="badge badge-time" id="lastUpdate">Loading…</span>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="signals">🎯 Latest Signals</div>
  <div class="tab" data-tab="positions">📍 Open Positions</div>
  <div class="tab" data-tab="postmortems">📝 Post-Mortems</div>
  <div class="tab" data-tab="weights">🎚️ Adaptive Weights</div>
  <div class="tab" data-tab="stats">📊 Stats (v3)</div>
</div>

<div id="tab-signals" class="tab-content"><div class="grid" id="signalGrid"><div class="empty">Loading signals…</div></div></div>
<div id="tab-positions" class="tab-content" style="display:none;"><div id="positionsList"><div class="empty">Loading…</div></div></div>
<div id="tab-postmortems" class="tab-content" style="display:none;"><div id="pmList"><div class="empty">Loading…</div></div></div>
<div id="tab-weights" class="tab-content" style="display:none;"><div id="weightsList"><div class="empty">Loading…</div></div></div>
<div id="tab-stats" class="tab-content" style="display:none;"><div id="statsBox"><div class="empty">Loading…</div></div></div>

<script src="app.js"></script>
</body>
</html>
