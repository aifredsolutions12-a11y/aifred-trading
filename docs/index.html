<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-TF AI Trading Signals</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    padding: 20px;
    line-height: 1.5;
  }
  h1, h2, h3 { color: #f0f6fc; }
  h1 { font-size: 1.8em; margin-bottom: 4px; }
  h2 { font-size: 1.3em; margin: 20px 0 10px; border-bottom: 1px solid #30363d; padding-bottom: 6px; }

  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .badge {
    display: inline-block; padding: 4px 10px; border-radius: 12px;
    font-size: 0.85em; font-weight: 600;
  }
  .badge-time { background: #21262d; color: #8b949e; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid #30363d; margin-bottom: 16px; flex-wrap: wrap; }
  .tab {
    padding: 8px 16px; cursor: pointer; background: #161b22;
    color: #8b949e; border: 1px solid #30363d; border-bottom: none;
    border-radius: 6px 6px 0 0; font-size: 0.9em;
  }
  .tab.active { background: #0d1117; color: #f0f6fc; border-bottom: 1px solid #0d1117; }

  /* Cards */
  .grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  }
  .card {
    background: #161b22; border: 1px solid #30363d;
    padding: 16px; border-radius: 8px;
  }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .card-symbol { font-size: 1.2em; font-weight: 700; color: #f0f6fc; }

  .pos {
    padding: 3px 10px; border-radius: 4px; font-size: 0.85em; font-weight: 600;
    text-transform: uppercase;
  }
  .pos-LONG  { background: #1f6f3a; color: white; }
  .pos-SHORT { background: #8b1538; color: white; }
  .pos-WAIT  { background: #6e4a17; color: white; }
  .pos-HOLD  { background: #44546a; color: white; }

  .conf-HIGH   { color: #56d364; }
  .conf-MEDIUM { color: #d29922; }
  .conf-LOW    { color: #f0883e; }
  .conf-SKIP   { color: #8b949e; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 0.9em; }
  .stat { display: flex; justify-content: space-between; padding: 3px 0; }
  .stat-label { color: #8b949e; }
  .stat-val { color: #f0f6fc; font-weight: 500; }

  .tf-trail { margin-top: 12px; padding-top: 10px; border-top: 1px solid #30363d; }
  .tf-row {
    display: grid; grid-template-columns: 50px 1fr 60px 70px;
    gap: 8px; padding: 3px 0; font-size: 0.82em; align-items: center;
  }
  .tf-name { color: #8b949e; font-weight: 600; }
  .tf-bar {
    background: #21262d; height: 6px; border-radius: 3px; position: relative;
    overflow: hidden;
  }
  .tf-bar-fill {
    position: absolute; top: 0; left: 0; height: 100%; border-radius: 3px;
  }
  .tf-score { text-align: right; color: #c9d1d9; }
  .tf-weight { text-align: right; color: #6e7681; font-size: 0.82em; }

  .narrative {
    font-size: 0.88em; margin-top: 10px; padding: 10px;
    background: #0d1117; border-left: 3px solid #58a6ff;
    border-radius: 4px; color: #c9d1d9;
  }
  .memory-reflection {
    font-size: 0.85em; margin-top: 8px; padding: 8px;
    background: #1d2127; border-left: 3px solid #d29922;
    border-radius: 4px; color: #c9d1d9;
  }

  /* Post-mortems tab */
  .pm-card {
    background: #161b22; border: 1px solid #30363d;
    padding: 14px; border-radius: 8px; margin-bottom: 12px;
  }
  .pm-head { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .pm-lesson { font-style: italic; margin: 8px 0; color: #c9d1d9; }
  .pm-adjustment { color: #58a6ff; font-size: 0.9em; padding: 6px; background: #0d1117; border-radius: 4px; }

  .empty {
    text-align: center; padding: 40px;
    color: #6e7681; background: #161b22;
    border-radius: 8px; border: 1px dashed #30363d;
  }

  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🤖 Multi-TF AI Trading Signals</h1>
    <p style="color:#8b949e; font-size:0.9em;">
      16 coins · 6 timeframes · code-driven confluence · adaptive weights
    </p>
  </div>
  <div>
    <span class="badge badge-time" id="lastUpdate">Loading…</span>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="signals">🎯 Latest Signals</div>
  <div class="tab" data-tab="postmortems">📝 Post-Mortems</div>
  <div class="tab" data-tab="weights">🎚️ Adaptive Weights</div>
</div>

<div id="tab-signals" class="tab-content"><div class="grid" id="signalGrid"><div class="empty">Loading signals…</div></div></div>
<div id="tab-postmortems" class="tab-content" style="display:none;"><div id="pmList"><div class="empty">Loading…</div></div></div>
<div id="tab-weights" class="tab-content" style="display:none;"><div id="weightsList"><div class="empty">Loading…</div></div></div>

<script>
const SIGNAL_INDEX = "data/signals_index.json";
const POSTMORTEM_INDEX = "data/postmortems_index.json";
const WEIGHTS_INDEX = "data/weights_index.json";

// Tab switching
document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(x => x.style.display = "none");
    t.classList.add("active");
    document.getElementById("tab-" + t.dataset.tab).style.display = "block";
  });
});

function fmtPrice(v) {
  if (v == null) return "—";
  if (Math.abs(v) >= 1000) return "$" + v.toLocaleString(undefined, { maximumFractionDigits: 2 });
  if (Math.abs(v) >= 1) return "$" + v.toFixed(4);
  if (Math.abs(v) >= 0.01) return "$" + v.toFixed(6);
  return "$" + v.toFixed(8);
}

function renderSignal(s) {
  const tfTrail = (s.tf_aggregate?.tf_trail || [])
    .map(t => {
      const pct = Math.max(0, Math.min(100, t.score));
      const color = pct >= 65 ? "#56d364" : pct <= 35 ? "#f85149" : "#d29922";
      return `
        <div class="tf-row">
          <span class="tf-name">${t.tf}</span>
          <div class="tf-bar"><div class="tf-bar-fill" style="width:${pct}%;background:${color};"></div></div>
          <span class="tf-score">${t.score.toFixed(0)}</span>
          <span class="tf-weight">(${(t.weight*100).toFixed(0)}%)</span>
        </div>`;
    }).join("");

  return `
    <div class="card">
      <div class="card-head">
        <span class="card-symbol">${s.symbol}</span>
        <span class="pos pos-${s.position}">${s.position}</span>
      </div>
      <div class="stats">
        <div class="stat"><span class="stat-label">Confidence</span><span class="stat-val conf-${s.confidence}">${s.confidence}</span></div>
        <div class="stat"><span class="stat-label">Confluence</span><span class="stat-val">${(s.final_confluence||0).toFixed(1)}%</span></div>
        <div class="stat"><span class="stat-label">EV (R)</span><span class="stat-val">${(s.ev_R||0).toFixed(2)}R</span></div>
        <div class="stat"><span class="stat-label">Win Prob</span><span class="stat-val">${s.estimated_win_prob_pct||0}%</span></div>
        <div class="stat"><span class="stat-label">Price</span><span class="stat-val">${fmtPrice(s.current_price)}</span></div>
        <div class="stat"><span class="stat-label">TP1 / SL</span><span class="stat-val">${fmtPrice(s.take_profit_1)} / ${fmtPrice(s.stop_loss)}</span></div>
      </div>

      <div class="tf-trail">
        <div style="font-size:0.85em; color:#8b949e; margin-bottom:6px;">TF Scoring Trail</div>
        ${tfTrail || '<div style="color:#6e7681; font-size:0.85em;">no data</div>'}
      </div>

      ${s.final_narrative ? `<div class="narrative">${s.final_narrative}</div>` : ""}
      ${s.memory_reflection ? `<div class="memory-reflection"><strong>💭 Memory:</strong> ${s.memory_reflection}</div>` : ""}
    </div>
  `;
}

function renderPostmortem(pm) {
  return `
    <div class="pm-card">
      <div class="pm-head">
        <strong>${pm.coin}</strong>
        <span style="color:#8b949e; font-size:0.85em;">
          ${pm.date} · ${pm.wins||0}W / ${pm.losses||0}L of ${pm.trades_reviewed||0}
        </span>
      </div>
      <div class="pm-lesson">"${pm.lesson || '—'}"</div>
      ${pm.adjustment ? `<div class="pm-adjustment"><strong>Adjustment:</strong> ${pm.adjustment}</div>` : ""}
      ${pm.methodology_flag ? `<div style="margin-top:6px; font-size:0.85em; color:#d29922;">⚙️ ${pm.methodology_flag}</div>` : ""}
    </div>
  `;
}

function renderWeights(w) {
  const weights = w.weights || {};
  const bars = Object.entries(weights)
    .sort((a, b) => b[1] - a[1])
    .map(([k, v]) => {
      const pct = v * 100;
      return `
        <div class="tf-row">
          <span class="tf-name" style="width:90px;">${k}</span>
          <div class="tf-bar"><div class="tf-bar-fill" style="width:${pct*3}%;background:#58a6ff;"></div></div>
          <span class="tf-score">${pct.toFixed(1)}%</span>
        </div>`;
    }).join("");

  return `
    <div class="pm-card">
      <div class="pm-head">
        <strong>${w.coin}</strong>
        <span style="color:#8b949e; font-size:0.85em;">Adaptive Weights</span>
      </div>
      ${bars}
    </div>
  `;
}

async function loadJSON(path) {
  try {
    const r = await fetch(path + "?t=" + Date.now());
    return await r.json();
  } catch (e) {
    return null;
  }
}

async function init() {
  const signals = await loadJSON(SIGNAL_INDEX);
  if (signals && signals.length > 0) {
    document.getElementById("signalGrid").innerHTML = signals.map(renderSignal).join("");
    document.getElementById("lastUpdate").textContent = "Last update: " + new Date(signals[0].timestamp).toLocaleString();
  } else {
    document.getElementById("signalGrid").innerHTML = '<div class="empty">No signals yet. Agent runs every 4 hours.</div>';
  }

  const pms = await loadJSON(POSTMORTEM_INDEX);
  if (pms && pms.length > 0) {
    document.getElementById("pmList").innerHTML = pms.map(renderPostmortem).join("");
  } else {
    document.getElementById("pmList").innerHTML = '<div class="empty">No post-mortems yet. Runs daily after midnight UTC.</div>';
  }

  const ws = await loadJSON(WEIGHTS_INDEX);
  if (ws && ws.length > 0) {
    document.getElementById("weightsList").innerHTML = ws.map(renderWeights).join("");
  } else {
    document.getElementById("weightsList").innerHTML = '<div class="empty">Adaptive weights appear after 20+ closed trades per coin.</div>';
  }
}

init();
setInterval(init, 60000); // refresh every minute
</script>
</body>
</html>
