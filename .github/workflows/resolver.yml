name: Resolver - Check TP/SL every 30m

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: workflow-commit-lock
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve open signals
        run: python -m memory.resolver

      - name: Export dashboard JSON
        run: python export_dashboard.py

      - name: Commit results
        run: |
          git config user.name  "resolver-bot"
          git config user.email "resolver-bot@users.noreply.github.com"
          git add data/ docs/data/
          git diff --staged --quiet && exit 0
          git commit -m "resolver $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "All push attempts failed"
          exit 1