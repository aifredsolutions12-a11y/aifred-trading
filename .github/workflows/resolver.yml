name: Resolver - Every 15 Minutes

on:
  schedule:
    - cron: "3,18,33,48 * * * *"   # Offset 3 min from quarters
  workflow_dispatch:
  repository_dispatch:
    types: [run-resolver]

concurrency:
  group: resolver-lock
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run resolver
        run: python -m memory.resolver

      - name: Commit & push updates
        run: |
          git config user.name  "resolver-bot"
          git config user.email "resolver-bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add -A
          git diff --cached --quiet || git commit -m "resolver $(date -u +%FT%TZ)"
          git push origin main || git push origin main --force-with-lease