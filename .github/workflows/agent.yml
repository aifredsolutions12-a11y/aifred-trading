name: Agent - Multi-TF Analysis (every 4h)

on:
  schedule:
    # Avoid GitHub cron peak times (top of hour) — :07 minute offset
    - cron: "7 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/coins.yaml"
      - "config/scoring_config.yaml"

concurrency:
  group: workflow-commit-lock
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify config files exist
        run: |
          test -f config/coins.yaml || { echo "❌ coins.yaml missing"; exit 1; }
          test -f config/scoring_config.yaml || { echo "❌ scoring_config.yaml missing"; exit 1; }
          test -f ai_analyzer/analyzer.py || { echo "❌ analyzer.py missing"; exit 1; }
          echo "✅ All config files present"

      - name: Run multi-TF analyzer per enabled coin
        run: |
          python - <<'EOF'
          import yaml
          import time
          import sys
          import traceback
          from ai_analyzer.analyzer import analyze

          with open("config/coins.yaml", "r", encoding="utf-8") as f:
              cfg = yaml.safe_load(f)

          coins = cfg.get("watchlist", {})
          enabled_symbols = [c["symbol"] for c in coins.values() if c.get("enabled", True)]

          print(f"\n🚀 Analyzing {len(enabled_symbols)} coins")
          print(f"   Symbols: {', '.join(enabled_symbols)}\n")

          results = []
          failures = []

          for sym in enabled_symbols:
              try:
                  verdict = analyze(sym)
                  if "error" not in verdict:
                      results.append(verdict)
                  else:
                      failures.append((sym, verdict["error"]))
              except Exception as e:
                  print(f"❌ {sym}: {e}")
                  traceback.print_exc()
                  failures.append((sym, str(e)))
              time.sleep(5)   # space out Gemini calls (15 RPM safety)

          # Summary
          print(f"\n{'='*60}")
          print(f"📊 AGENT RUN SUMMARY")
          print(f"{'='*60}")
          print(f"  ✅ Successful:  {len(results)}")
          print(f"  ❌ Failed:      {len(failures)}")
          for sym, err in failures:
              print(f"     {sym}: {err[:80]}")
          print(f"{'='*60}\n")

          # Fail the workflow if every coin failed
          if len(results) == 0 and len(failures) > 0:
              sys.exit(1)
          EOF

      - name: Export dashboard JSON
        run: |
          if [ -f export_dashboard.py ]; then
            python export_dashboard.py
          else
            echo "ℹ️ export_dashboard.py not found — skipping"
          fi

      - name: Run summary
        run: |
          echo "::group::Agent Summary"
          echo "Run at: $(date -u +%FT%TZ)"
          if [ -d data/signals ]; then
            echo "Total signals: $(ls data/signals/*.json 2>/dev/null | wc -l)"
            echo "New (this hour): $(find data/signals -name "*.json" -mmin -60 2>/dev/null | wc -l)"
          fi
          echo "::endgroup::"

      - name: Commit results
        run: |
          git config user.name  "agent-bot"
          git config user.email "agent-bot@users.noreply.github.com"
          git add data/ docs/data/ 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "agent multi-tf $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "❌ All push attempts failed"
          exit 1