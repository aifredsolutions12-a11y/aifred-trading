name: Agent - Hourly Multi-TF Analysis

on:
  schedule:
    - cron: "7 * * * *"   # Every hour at :07 UTC (avoids peak load)
  workflow_dispatch:
  repository_dispatch:
    types: [run-agent]

concurrency:
  group: agent-lock
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run hourly multi-TF analyzer
        run: python -m ai_analyzer.analyzer

      - name: Commit & push results
        run: |
          git config user.name  "agent-bot"
          git config user.email "agent-bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add -A
          git diff --cached --quiet || git commit -m "agent run $(date -u +%FT%TZ)"
          git push origin main || git push origin main --force-with-lease