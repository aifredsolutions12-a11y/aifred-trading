name: Post-Mortem - End of Cycle (11 AM PH)

on:
  schedule:
    - cron: "5 3 * * *"   # 11:05 AM PH = 03:05 UTC
  workflow_dispatch:

concurrency:
  group: postmortem-lock
  cancel-in-progress: false

jobs:
  postmortem:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run post-mortem
        run: python -m memory.postmortem

      - name: Commit & push results
        run: |
          git config user.name  "postmortem-bot"
          git config user.email "postmortem-bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add -A
          git diff --cached --quiet || git commit -m "post-mortem $(date -u +%FT%TZ)"
          git push origin main || git push origin main --force-with-lease