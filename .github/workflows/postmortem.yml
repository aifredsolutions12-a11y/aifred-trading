name: Post-Mortem - Daily lessons review

on:
  schedule:
    # 00:30 UTC daily — after most trades resolve overnight
    - cron: "30 0 * * *"
  workflow_dispatch:

concurrency:
  group: workflow-commit-lock
  cancel-in-progress: false

jobs:
  postmortem:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily post-mortem
        run: python -m memory.postmortem

      - name: Update adaptive weights from latest outcomes
        run: |
          python - <<'EOF'
          import yaml
          from ai_analyzer.weight_tracker import adjust_weights_for_coin
          from ai_analyzer.memory import load_closed_trades

          with open("config/coins.yaml", "r", encoding="utf-8") as f:
              cfg = yaml.safe_load(f)

          coins = cfg.get("watchlist", {})
          enabled = [c["symbol"] for c in coins.values() if c.get("enabled", True)]

          print(f"🎚️ Adjusting weights for {len(enabled)} coins...\n")
          for sym in enabled:
              closed = load_closed_trades(sym)
              result = adjust_weights_for_coin(sym, closed)
              if result.get("adjusted"):
                  print(f"  ✅ {sym}: {len(result.get('notes', []))} weight adjustments")
                  for note in result.get("notes", [])[:3]:
                      print(f"     · {note}")
          print("\n✅ Weight tuning complete")
          EOF

      - name: Commit results
        run: |
          git config user.name  "postmortem-bot"
          git config user.email "postmortem-bot@users.noreply.github.com"
          git add data/postmortems/ data/adaptive_weights/ data/journal/ 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "postmortem + weights $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "❌ All push attempts failed"
          exit 1